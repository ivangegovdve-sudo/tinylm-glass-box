[project]
name = "tinylm-glass-box-api"
version = "0.1.0"
description = "FastAPI backend for the TinyLM Glass Box experiment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinylm_glass_box_api"]

